# Render blueprint for the Movara backend.
# In Render: New -> Blueprint -> point at this repo.
#
# This file MUST live at the repository root -- Render only looks for it
# there. `rootDir` below is what points the service at the backend/ folder.
#
# The service is a FastAPI (Python) app built via Docker
# (backend/Dockerfile), which pins the Python version explicitly.
#
# Data lives in MongoDB Atlas (see MONGODB_URI below), so it now PERSISTS
# across the free plan's sleeps and redeploys. The plan still sleeps after
# ~15 min idle, which only means a slow first request, not data loss.
services:
  - type: web
    name: movara-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/exercises
    envVars:
      # Your MongoDB Atlas connection string, INCLUDING the /movara database
      # name and password. sync:false keeps it out of git -- set the real
      # value in the Render dashboard (Environment tab), never here.
      - key: MONGODB_URI
        sync: false
      # Set this to your deployed frontend origin, e.g.
      # https://movara-9ol.pages.dev  (no trailing slash)
      - key: ALLOWED_ORIGINS
        sync: false
