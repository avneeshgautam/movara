name: Deploy frontend to Cloudflare Pages

# Builds the Flutter web app and deploys it to Cloudflare Pages on every push
# that touches the frontend. Runs the Flutter build in CI (Cloudflare's own
# build image has no Flutter), so the compiled app is always current.
#
# One-time setup: add a repository secret CLOUDFLARE_API_TOKEN
#   (GitHub repo -> Settings -> Secrets and variables -> Actions).
# The token needs the "Cloudflare Pages: Edit" permission.

# Git integration is disconnected on the Cloudflare Pages project so that this
# Direct Upload (wrangler pages deploy) is allowed to publish the pre-built app.
on:
  push:
    branches: [first-build]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build web
        working-directory: frontend
        run: |
          flutter pub get
          flutter build web --release \
            --dart-define=API_BASE_URL=https://movara-backend-h22y.onrender.com/api

      # Each step's pass/fail is visible through the GitHub API without reading
      # logs, and failures are surfaced as ::error:: annotations (also readable
      # without logging in). No token value is ever printed.
      - name: Diagnose token (direct Cloudflare API)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCT: 65ade6a68860ad7b630077ff6f3e4f5c
        run: |
          h="Authorization: Bearer $CF_TOKEN"
          api=https://api.cloudflare.com/client/v4
          user_verify=$(curl -s -H "$h" "$api/user/tokens/verify" | jq -c '{ok: .success, status: .result.status, err: [.errors[]?.code]}')
          acct_verify=$(curl -s -H "$h" "$api/accounts/$ACCT/tokens/verify" | jq -c '{ok: .success, status: .result.status, err: [.errors[]?.code]}')
          user_http=$(curl -s -o /dev/null -w '%{http_code}' -H "$h" "$api/user")
          pages=$(curl -s -H "$h" "$api/accounts/$ACCT/pages/projects" | jq -c '{ok: .success, err: [.errors[]? | "\(.code) \(.message)"], projects: [.result[]?.name]}')
          echo "::error::TOKEN_DIAG len=${#CF_TOKEN} user_verify=$user_verify acct_verify=$acct_verify user_http=$user_http pages=$pages"

      - name: Create Direct-Upload Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 65ade6a68860ad7b630077ff6f3e4f5c
        run: |
          set +e
          out=$(npx --yes wrangler@4 pages project create movara-app --production-branch=first-build 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ] && ! printf '%s' "$out" | grep -qi 'already exists'; then
            msg=$(printf '%s' "$out" | grep -iE 'error|code|permission' | head -8 | tr '\n' '|')
            echo "::error::WRANGLER_CREATE_FAIL: $msg"
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 65ade6a68860ad7b630077ff6f3e4f5c
        run: |
          set +e
          out=$(npx --yes wrangler@4 pages deploy frontend/build/web --project-name=movara-app --branch=first-build 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            msg=$(printf '%s' "$out" | grep -iE 'error|failed|code|permission' | head -12 | tr '\n' '|')
            echo "::error::WRANGLER_DEPLOY_FAIL: $msg"
            exit 1
          fi
