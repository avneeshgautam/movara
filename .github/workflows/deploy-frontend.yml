name: Deploy frontend to Cloudflare Pages

# Builds the Flutter web app and deploys it to Cloudflare Pages on every push
# that touches the frontend. Runs the Flutter build in CI (Cloudflare's own
# build image has no Flutter), so the compiled app is always current.
#
# One-time setup: add a repository secret CLOUDFLARE_API_TOKEN (Pages: Edit)
#   (GitHub repo -> Settings -> Secrets and variables -> Actions).
# The token needs the "Cloudflare Pages: Edit" permission.

# Git integration is disconnected on the Cloudflare Pages project so that this
# Direct Upload (wrangler pages deploy) is allowed to publish the pre-built app.
on:
  push:
    branches: [first-build]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the local toolchain so CI builds match what is tested.
          flutter-version: 3.47.5

      # The Firebase web config lives in the gitignored firebase.env locally.
      # In CI it comes from one repository secret per key, so nothing is
      # committed to the repo.
      - name: Build web
        working-directory: frontend
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        run: |
          flutter pub get
          if [ -z "$FIREBASE_API_KEY" ] || [ -z "$FIREBASE_PROJECT_ID" ] || [ -z "$FIREBASE_APP_ID" ]; then
            echo "::warning::Firebase secrets missing; the web app will show its setup screen."
          fi
          flutter build web --release \
            --dart-define=API_BASE_URL=https://movara-backend-h22y.onrender.com/api \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_AUTH_DOMAIN="$FIREBASE_AUTH_DOMAIN" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID"

      # create/deploy surface wrangler's real error as an ::error:: annotation on
      # failure; annotations are readable via the GitHub API without a login.
      - name: Create Direct-Upload Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 65ade6a68860ad7b630077ff6f3e4f5c
        run: |
          set +e
          out=$(npx --yes wrangler@4 pages project create movara-app --production-branch=first-build 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ] && ! printf '%s' "$out" | grep -qi 'already exists'; then
            msg=$(printf '%s' "$out" | grep -iE 'error|code|permission' | head -8 | tr '\n' '|')
            echo "::error::WRANGLER_CREATE_FAIL: $msg"
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 65ade6a68860ad7b630077ff6f3e4f5c
        run: |
          set +e
          out=$(npx --yes wrangler@4 pages deploy frontend/build/web --project-name=movara-app --branch=first-build 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            msg=$(printf '%s' "$out" | grep -iE 'error|failed|code|permission' | head -12 | tr '\n' '|')
            echo "::error::WRANGLER_DEPLOY_FAIL: $msg"
            exit 1
          fi
