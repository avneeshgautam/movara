name: Deploy frontend to Cloudflare Pages

# Builds the Flutter web app and deploys it to Cloudflare Pages on every push
# that touches the frontend. Runs the Flutter build in CI (Cloudflare's own
# build image has no Flutter), so the compiled app is always current.
#
# One-time setup: add a repository secret CLOUDFLARE_API_TOKEN
#   (GitHub repo -> Settings -> Secrets and variables -> Actions).
# The token needs the "Cloudflare Pages: Edit" permission.

# Git integration is disconnected on the Cloudflare Pages project so that this
# Direct Upload (wrangler pages deploy) is allowed to publish the pre-built app.
on:
  push:
    branches: [first-build]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build web
        working-directory: frontend
        run: |
          flutter pub get
          flutter build web --release \
            --dart-define=API_BASE_URL=https://movara-backend-h22y.onrender.com/api

      # Split into separate steps so the run's per-step pass/fail (visible via
      # the API without reading logs) pinpoints the cause: if "Validate token"
      # fails it's the CLOUDFLARE_API_TOKEN secret; if that passes but a later
      # step fails, the token is fine and the problem is the project/deploy.
      - name: Validate token (wrangler whoami)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 65ade6a68860ad7b630077ff6f3e4f5c
        run: npx --yes wrangler@3 whoami

      - name: Create Direct-Upload Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 65ade6a68860ad7b630077ff6f3e4f5c
        run: |
          npx --yes wrangler@3 pages project create movara-app \
            --production-branch=first-build \
            || echo "project create skipped (already exists)"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 65ade6a68860ad7b630077ff6f3e4f5c
        run: |
          npx --yes wrangler@3 pages deploy frontend/build/web \
            --project-name=movara-app --branch=first-build
