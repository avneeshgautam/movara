name: movara_app
description: Movara - a simple workout tracker (reps, sets, exercises).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  # Syne (display) + Inter (body), per the Figma design tokens.
  google_fonts: ^6.2.1
  # Persists reminder settings across refreshes (localStorage on web).
  shared_preferences: ^2.3.0
  # Browser Notification API access for water reminders.
  web: ^1.1.0
  # Route map tiles from OpenStreetMap — no API key, no billing account.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # Device GPS for live run tracking (browser Geolocation API on web).
  geolocator: ^13.0.2
  # Google sign-in via Firebase Authentication.
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  gal: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
