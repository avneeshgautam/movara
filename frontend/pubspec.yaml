name: movara_app
description: Movara - a simple workout tracker (reps, sets, exercises).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  # Syne (display) + Inter (body), per the Figma design tokens.
  google_fonts: ^6.2.1
  # Persists reminder settings across refreshes (localStorage on web).
  shared_preferences: ^2.3.0
  # Browser Notification API access for water reminders.
  web: ^1.1.0
  # Google sign-in via Firebase Authentication.
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
