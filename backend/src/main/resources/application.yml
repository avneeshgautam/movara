server:
  # Hosts like Render/Cloud Run inject the port to bind. Falls back to 8080 locally.
  port: ${PORT:8080}

spring:
  application:
    name: movara-backend

  data:
    mongodb:
      # Full connection string, INCLUDING the database name, e.g.
      #   mongodb+srv://user:pass@cluster0.xxxx.mongodb.net/movara?retryWrites=true&w=majority
      # Never commit the real value -- it holds your password. Set it via the
      # MONGODB_URI environment variable (locally and on Render).
      # The localhost fallback is only for a local mongod during development.
      uri: ${MONGODB_URI:mongodb://localhost:27017/movara}
      # Honor @Indexed annotations (off by default in Spring Boot 3) so the
      # unique index on Exercise.name is actually created.
      auto-index-creation: true

# Origins allowed to call the API, comma separated.
# In production set ALLOWED_ORIGINS to your deployed frontend, e.g.
#   ALLOWED_ORIGINS=https://movara.pages.dev
movara:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
